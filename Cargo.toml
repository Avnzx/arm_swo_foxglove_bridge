[package]
name = "arm_swo_foxglove_bridge"
version = "0.1.0"
edition = "2024"
authors = ["Aavin Fernando <aavin.fernando@gmail.com>", "Evan La Fontaine"]
license = "MIT OR Apache-2.0"
description = "Bridge between ARM Serial Wire Out and Foxglove Studio / Lichtblick"
readme = "README.md"
homepage = "https://github.com/Avnzx/arm_swo_foxglove_bridge"
repository = "https://github.com/Avnzx/arm_swo_foxglove_bridge"
keywords = ["cli", "arm", "swo", "debugging"]
categories = ["command-line-utilities"]


[dependencies]
fixed = "1.29.0"
foxglove = "0.16.2"
heapless = "0.9.2"
prost = "0.13.5"
prost-types = "0.13.5"
ron = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
